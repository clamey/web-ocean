// ---- js/wgsl/common.js ----
// Shared constants and WGSL snippets.
const N = 256;          // FFT resolution per cascade
const LOGN = 8;
const CASCADES = 6;
const SKY_W = 256;      // sky-view LUT size
const SKY_H = 144;
const ENV_SIZE = 256;   // environment cube face size
const ENV_MIPS = 9;

// Per-frame uniform block shared by every render / sky shader.
// Layout must match the Float32Array offsets in main.js (FR_* constants).
const FRAME_WGSL = /* wgsl */ `
struct Frame {
  viewProj: mat4x4f,   // camera-relative view-projection (reverse-Z, infinite)
  camPos:   vec4f,     // xyz metres, w = time (s)
  camRight: vec4f,     // xyz * tan(fovX/2)
  camUp:    vec4f,     // xyz * tan(fovY/2)
  camFwd:   vec4f,     // xyz
  sunDir:   vec4f,     // xyz towards sun, w = solar illuminance scale
  screen:   vec4f,     // w, h, 1/w, 1/h
  cascL:    array<vec4f, 2>,  // cascade patch sizes (m), index [c>>2][c&3]
  cascInvL: array<vec4f, 2>,
  windP:    array<vec4f, 2>,  // [0].xy = wind direction (unit), [0].z = wind speed, [1].x = bird count
  lodP:     vec4f,     // CDLOD base range, grid quads per node, -, -
  post:     vec4f,     // exposure, bloom strength, frame index, -
  atmo:     vec4f,     // haze (mie multiplier), camera altitude km, -, -
  waterCol: vec4f,     // body scatter colour rgb, unresolved slope variance
  sssCol:   vec4f,     // sss colour rgb, sss strength
  foamP:    vec4f,     // J threshold, J gain, foam intensity, lace sharpness
  fogExt:   vec4f,     // rgb extinction per metre near sea level
  cloudP:   vec4f,     // altitude km, coverage, optical density, wind time
  astro:    vec4f,     // local sidereal time, latitude, scene azimuth of true north (rad), pre-exposure
  moonDir:  vec4f,     // xyz towards the moon, w = moonlight illuminance above the atmosphere
  moonUp:   vec4f,     // xyz towards the north ecliptic pole (~ lunar north), w = angular radius
};
`;

const ATMO_CORE_WGSL = /* wgsl */ `
const PI: f32 = 3.14159265358979;
const RG: f32 = 6360.0;
const RT: f32 = 6460.0;
const RAY_S: vec3f = vec3f(5.802e-3, 13.558e-3, 33.1e-3);
const MIE_S: f32 = 3.996e-3;
const MIE_E: f32 = 4.40e-3;
const OZO_A: vec3f = vec3f(0.650e-3, 1.881e-3, 0.085e-3);
const SUN_ANG_R: f32 = 0.004675;
const TRANS_W: f32 = 256.0;
const TRANS_H: f32 = 64.0;
const MS_SIZE: f32 = 32.0;

struct Medium { ext: vec3f, rayS: vec3f, mieS: f32 };

fn medium(h: f32, haze: f32) -> Medium {
  let hh = max(h, 0.0);
  let dR = exp(-hh / 8.0);
  // aerosols: regular 1.2 km layer plus a dense marine boundary layer
  let dM = exp(-hh / 1.2);
  let dO = max(0.0, 1.0 - abs(hh - 25.0) / 15.0);
  var m: Medium;
  m.rayS = RAY_S * dR;
  m.mieS = MIE_S * dM * haze;
  m.ext = m.rayS + vec3f(MIE_E * dM * haze) + OZO_A * dO;
  return m;
}

fn raySphere(ro: vec3f, rd: vec3f, R: f32) -> vec2f {
  let l = length(ro);
  let b = dot(ro, rd);
  let c = (l - R) * (l + R);
  let d = b * b - c;
  if (d < 0.0) { return vec2f(-1.0, -1.0); }
  let s = sqrt(d);
  return vec2f(-b - s, -b + s);
}

fn rhoOf(r: f32) -> f32 { return sqrt(max(0.0, (r - RG) * (r + RG))); }

fn transRMuToUV(r: f32, mu: f32) -> vec2f {
  let H = sqrt(RT * RT - RG * RG);
  let rho = rhoOf(r);
  let disc = r * r * (mu * mu - 1.0) + RT * RT;
  let d = max(0.0, -r * mu + sqrt(max(disc, 0.0)));
  let dMin = RT - r;
  let dMax = rho + H;
  let x = (d - dMin) / (dMax - dMin);
  let y = rho / H;
  return vec2f(x, y);
}

fn transUVToRMu(uv: vec2f) -> vec2f {
  let H = sqrt(RT * RT - RG * RG);
  let rho = H * uv.y;
  let r = sqrt(rho * rho + RG * RG);
  let dMin = RT - r;
  let dMax = rho + H;
  let d = dMin + uv.x * (dMax - dMin);
  var mu = 1.0;
  if (d > 0.0) { mu = (H * H - rho * rho - d * d) / (2.0 * r * d); }
  return vec2f(r, clamp(mu, -1.0, 1.0));
}

fn fromUnitToSubUvs(u: f32, res: f32) -> f32 { return (u + 0.5 / res) * (res / (res + 1.0)); }
fn fromSubUvsToUnit(u: f32, res: f32) -> f32 { return (u - 0.5 / res) * (res / (res - 1.0)); }

fn phaseRayleigh(c: f32) -> f32 { return 3.0 / (16.0 * PI) * (1.0 + c * c); }
fn phaseMie(c: f32, g: f32) -> f32 {
  let g2 = g * g;
  return 3.0 / (8.0 * PI) * ((1.0 - g2) * (1.0 + c * c)) / ((2.0 + g2) * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}
fn phaseHG(c: f32, g: f32) -> f32 {
  let g2 = g * g;
  return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}

// true when the sun is below the geometric horizon of a point at radius r
fn sunBelowHorizon(r: f32, mu: f32) -> bool {
  return mu < -rhoOf(r) / r;
}
// visible fraction of the solar disc from a point at radius r (the Earth's shadow); exactly
// 1 while the whole disc is above that point's horizon
fn earthShadow(r: f32, mu: f32) -> f32 {
  let muH = -rhoOf(r) / r;
  return smoothstep(muH - SUN_ANG_R, muH + SUN_ANG_R, mu);
}
`;

// Hashing helpers used by the procedural texture generators.
const NOISE_WGSL = /* wgsl */ `
fn pcgHash(v: u32) -> u32 {
  let s = v * 747796405u + 2891336453u;
  let w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
  return (w >> 22u) ^ w;
}
fn hashGrad(i: vec2i) -> vec2f {
  let h = pcgHash(u32(i.x) * 1664525u + pcgHash(u32(i.y) + 1013904223u));
  let a = f32(h) * (6.28318530718 / 4294967296.0);
  return vec2f(cos(a), sin(a));
}
fn gnoise(p: vec2f) -> f32 {
  let i = vec2i(floor(p));
  let f = p - floor(p);
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let a = dot(hashGrad(i), f);
  let b = dot(hashGrad(i + vec2i(1, 0)), f - vec2f(1.0, 0.0));
  let c = dot(hashGrad(i + vec2i(0, 1)), f - vec2f(0.0, 1.0));
  let d = dot(hashGrad(i + vec2i(1, 1)), f - vec2f(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
`;

// Periodic (tileable) noise for procedural textures. Requires NOISE_WGSL.
const PERIODIC_WGSL = /* wgsl */ `
fn pnoise(p: vec2f, period: i32) -> f32 {
  let i = vec2i(floor(p));
  let f = p - floor(p);
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let i00 = (i % period + period) % period;
  let i10 = ((i + vec2i(1, 0)) % period + period) % period;
  let i01 = ((i + vec2i(0, 1)) % period + period) % period;
  let i11 = ((i + vec2i(1, 1)) % period + period) % period;
  let a = dot(hashGrad(i00), f);
  let b = dot(hashGrad(i10), f - vec2f(1.0, 0.0));
  let c = dot(hashGrad(i01), f - vec2f(0.0, 1.0));
  let d = dot(hashGrad(i11), f - vec2f(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
fn pfbm(p: vec2f, period: i32, oct: i32) -> f32 {
  var s = 0.0; var a = 0.5; var q = p; var per = period;
  for (var o = 0; o < oct; o++) {
    s += a * pnoise(q, per);
    q *= 2.0; per *= 2; a *= 0.5;
  }
  return s;
}
`;

// ---- js/wgsl/sim.js ----
// FFT ocean simulation (Tessendorf) — 4 cascades of 256^2.

const SIM_STRUCT = /* wgsl */ `
const N: u32 = ${N}u;
const LOGN: u32 = ${LOGN}u;
const PI: f32 = 3.14159265358979;
const GRAV: f32 = 9.81;
const SURF: f32 = 7.4e-5;   // surface tension / density

struct Sim {
  L:          array<vec4f, 2>,  // patch size per cascade ([c>>2][c&3])
  kMin:       array<vec4f, 2>,
  kMax:       array<vec4f, 2>,
  foamDecay:  array<vec4f, 2>,  // 1/s per cascade
  foamThresh: array<vec4f, 2>,  // Jacobian threshold per cascade
  wind:       vec4f,  // U10 m/s, direction rad, fetch m, gamma
  swell:      vec4f,  // Hs m, direction rad, peak omega, spreading exponent
  misc:       vec4f,  // choppiness, short wave cut (m), loop period s, seed
  timeP:      vec4f,  // time (looped), dt, foam gain, spectrum gain
};
@group(0) @binding(0) var<uniform> S: Sim;

fn waveVec(x: u32, y: u32, L: f32) -> vec2f {
  let nx = select(i32(x), i32(x) - i32(N), x >= N / 2u);
  let ny = select(i32(y), i32(y) - i32(N), y >= N / 2u);
  return vec2f(f32(nx), f32(ny)) * (2.0 * PI / L);
}
fn omegaOf(k: f32) -> f32 { return sqrt(GRAV * k + SURF * k * k * k); }
fn dOmegaOf(k: f32) -> f32 { return (GRAV + 3.0 * SURF * k * k) / (2.0 * omegaOf(k)); }
fn cmul(a: vec2f, b: vec2f) -> vec2f { return vec2f(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
fn mulI(a: vec2f) -> vec2f { return vec2f(-a.y, a.x); }
`;

const SIM_INIT = SIM_STRUCT + NOISE_WGSL + /* wgsl */ `
@group(0) @binding(1) var<storage, read_write> h0: array<vec4f>;

fn rand01(s: u32) -> f32 { return (f32(pcgHash(s) >> 8u) + 0.5) / 16777216.0; }
fn gauss2(seed: u32) -> vec2f {
  let u1 = rand01(seed * 2u + 17u);
  let u2 = rand01(seed * 2u + 18u + pcgHash(seed));
  let r = sqrt(-2.0 * log(u1));
  let a = 2.0 * PI * u2;
  return r * vec2f(cos(a), sin(a));
}
fn wrapAngle(a: f32) -> f32 {
  var x = a;
  x = x - 2.0 * PI * floor((x + PI) / (2.0 * PI));
  return x;
}
fn jonswap(w: f32, wp: f32, alpha: f32, gamma: f32) -> f32 {
  let sigma = select(0.09, 0.07, w <= wp);
  let d = (w - wp) / (sigma * wp);
  let r = exp(-0.5 * d * d);
  let q = wp / w;
  let q2 = q * q;
  return alpha * GRAV * GRAV / (w * w * w * w * w) * exp(-1.25 * q2 * q2) * pow(gamma, r);
}
// Donelan-Banner directional spreading (normalised over [-pi, pi])
fn donelanBanner(theta: f32, w: f32, wp: f32) -> f32 {
  let ratio = w / wp;
  var beta: f32;
  if (ratio < 0.95) {
    beta = 2.61 * pow(ratio, 1.3);
  } else if (ratio < 1.6) {
    beta = 2.28 * pow(ratio, -1.3);
  } else {
    let eps = -0.4 + 0.8393 * exp(-0.567 * log(ratio * ratio));
    beta = pow(10.0, eps);
  }
  let sh = 1.0 / cosh(clamp(beta * theta, -20.0, 20.0));
  return beta / (2.0 * tanh(beta * PI)) * sh * sh;
}
// cos^2s(theta/2) spreading, normalised
fn cosSpread(theta: f32, s: f32) -> f32 {
  let q = sqrt(s + 0.25) / (2.0 * sqrt(PI));
  return q * pow(abs(cos(theta * 0.5)), 2.0 * s);
}

fn spectrum(k: vec2f) -> f32 {
  let kl = length(k);
  let w = omegaOf(kl);
  let theta = atan2(k.y, k.x);
  // fetch-limited wind sea (JONSWAP)
  let U = S.wind.x;
  let F = S.wind.z;
  var Sw = 0.0;
  if (U > 0.1) {
    let alpha = 0.076 * pow(U * U / (F * GRAV), 0.22);
    let wp = 22.0 * pow(GRAV * GRAV / (U * F), 1.0 / 3.0);
    Sw = jonswap(w, wp, alpha, S.wind.w) * donelanBanner(wrapAngle(theta - S.wind.y), w, wp);
  }
  // swell: narrow, long-crested JONSWAP
  if (S.swell.x > 0.001) {
    let ws = S.swell.z;
    let gs = 6.0;
    let hs4 = S.swell.x * 0.25;
    let alphaS = hs4 * hs4 * 5.0 * ws * ws * ws * ws / (GRAV * GRAV) * (1.0 - 0.287 * log(gs));
    Sw += jonswap(w, ws, alphaS, gs) * cosSpread(wrapAngle(theta - S.swell.y), S.swell.w);
  }
  // damp the very shortest waves
  let sc = S.misc.y;
  Sw *= exp(-kl * kl * sc * sc);
  return Sw * dOmegaOf(kl) / kl * S.timeP.w;
}

fn amplitude(k: vec2f, c: u32) -> f32 {
  let kl = length(k);
  if (kl < 1e-5 || kl < S.kMin[c >> 2u][c & 3u] || kl >= S.kMax[c >> 2u][c & 3u]) { return 0.0; }
  let dk = 2.0 * PI / S.L[c >> 2u][c & 3u];
  // the finest cascades are toned down (they otherwise read as crumpled foil)
  let g = select(1.0, select(0.85, 0.6, c == 5u), c >= 4u);
  return sqrt(max(spectrum(k), 0.0)) * dk * 0.5 * g;
}

@compute @workgroup_size(16, 16, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  let c = id.z;
  let L = S.L[c >> 2u][c & 3u];
  let k = waveVec(id.x, id.y, L);
  let mx = (N - id.x) % N;
  let my = (N - id.y) % N;
  let seed = u32(S.misc.w) * 7919u + c * 1000003u;
  let a = gauss2(seed + (id.y * N + id.x)) * amplitude(k, c);
  let b = gauss2(seed + (my * N + mx)) * amplitude(-k, c);
  h0[(c * N + id.y) * N + id.x] = vec4f(a, b.x, -b.y);
}
`;

const SIM_EVOLVE = SIM_STRUCT + /* wgsl */ `
@group(0) @binding(1) var<storage, read> h0: array<vec4f>;
@group(0) @binding(2) var<storage, read_write> specA: array<vec4f>;
@group(0) @binding(3) var<storage, read_write> specB: array<vec4f>;

@compute @workgroup_size(16, 16, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  let c = id.z;
  let idx = (c * N + id.y) * N + id.x;
  let k = waveVec(id.x, id.y, S.L[c >> 2u][c & 3u]);
  let kl = length(k);
  if (kl < 1e-5) {
    specA[idx] = vec4f(0.0);
    specB[idx] = vec4f(0.0);
    return;
  }
  let w0 = 2.0 * PI / S.misc.z;
  let w = floor(omegaOf(kl) / w0) * w0;
  let ph = w * S.timeP.x;
  let e = vec2f(cos(ph), sin(ph));
  let H0 = h0[idx];
  // h0(k) travels along +k: h(k,t) = h0(k) e^{-iwt} + conj(h0(-k)) e^{iwt}
  let h = cmul(H0.xy, vec2f(e.x, -e.y)) + cmul(H0.zw, e);
  let ih = mulI(h);
  let lam = S.misc.x;
  let ik = 1.0 / kl;
  let Dx = ih * (lam * k.x * ik);
  let Dz = ih * (lam * k.y * ik);
  let jxz = h * (-lam * k.x * k.y * ik);
  let sx = ih * k.x;
  let sz = ih * k.y;
  let jxx = h * (-lam * k.x * k.x * ik);
  let jzz = h * (-lam * k.y * k.y * ik);
  specA[idx] = vec4f(Dx + mulI(Dz), h + mulI(jxz));
  specB[idx] = vec4f(sx + mulI(sz), jxx + mulI(jzz));
}
`;

const FFT_CORE = /* wgsl */ `
const N: u32 = ${N}u;
const LOGN: u32 = ${LOGN}u;
const PI: f32 = 3.14159265358979;
var<workgroup> wa: array<vec4f, ${N}>;
var<workgroup> wb: array<vec4f, ${N}>;
fn cmul(a: vec2f, b: vec2f) -> vec2f { return vec2f(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
fn bitrev(i: u32) -> u32 { return reverseBits(i) >> (32u - LOGN); }
// In-place radix-2 inverse FFT over shared memory (input already bit-reversed).
fn butterflies(t: u32) {
  for (var s = 0u; s < LOGN; s++) {
    let half = 1u << s;
    let pos = t & (half - 1u);
    let i0 = ((t >> s) << (s + 1u)) + pos;
    let i1 = i0 + half;
    let ang = PI * f32(pos) / f32(half);
    let w = vec2f(cos(ang), sin(ang));
    let a0 = wa[i0]; let a1 = wa[i1];
    let b0 = wb[i0]; let b1 = wb[i1];
    let ta = vec4f(cmul(a1.xy, w), cmul(a1.zw, w));
    let tb = vec4f(cmul(b1.xy, w), cmul(b1.zw, w));
    wa[i0] = a0 + ta; wa[i1] = a0 - ta;
    wb[i0] = b0 + tb; wb[i1] = b0 - tb;
    workgroupBarrier();
  }
}
`;

const FFT_ROWS = FFT_CORE + /* wgsl */ `
@group(0) @binding(0) var<storage, read> inA: array<vec4f>;
@group(0) @binding(1) var<storage, read> inB: array<vec4f>;
@group(0) @binding(2) var<storage, read_write> outA: array<vec4f>;
@group(0) @binding(3) var<storage, read_write> outB: array<vec4f>;

@compute @workgroup_size(${N / 2})
fn main(@builtin(workgroup_id) wg: vec3u, @builtin(local_invocation_index) t: u32) {
  let base = (wg.z * N + wg.x) * N;
  let e0 = t;
  let e1 = t + N / 2u;
  wa[bitrev(e0)] = inA[base + e0];
  wa[bitrev(e1)] = inA[base + e1];
  wb[bitrev(e0)] = inB[base + e0];
  wb[bitrev(e1)] = inB[base + e1];
  workgroupBarrier();
  butterflies(t);
  outA[base + e0] = wa[e0];
  outA[base + e1] = wa[e1];
  outB[base + e0] = wb[e0];
  outB[base + e1] = wb[e1];
}
`;

// Column pass + final assembly (displacement / derivative / slope-moment textures).
const FFT_COLS = FFT_CORE + /* wgsl */ `
@group(0) @binding(0) var<storage, read> inA: array<vec4f>;
@group(0) @binding(1) var<storage, read> inB: array<vec4f>;
@group(0) @binding(2) var dispOut: texture_storage_2d_array<rgba16float, write>;
@group(0) @binding(3) var derivOut: texture_storage_2d_array<rgba16float, write>;
@group(0) @binding(4) var momOut: texture_storage_2d_array<rgba16float, write>;

fn emit(x: u32, y: u32, c: u32, a: vec4f, b: vec4f) {
  // a = (Dx, Dz, Dy, jxz), b = (sx, sz, jxx, jzz)
  let p = vec2u(x, y);
  textureStore(dispOut, p, c, vec4f(a.x, a.z, a.y, a.w));
  textureStore(derivOut, p, c, b);
  textureStore(momOut, p, c, vec4f(b.x * b.x, b.y * b.y, b.x * b.y, 0.0));
}

@compute @workgroup_size(${N / 2})
fn main(@builtin(workgroup_id) wg: vec3u, @builtin(local_invocation_index) t: u32) {
  let x = wg.x;
  let c = wg.z;
  let e0 = t;
  let e1 = t + N / 2u;
  let i0 = (c * N + e0) * N + x;
  let i1 = (c * N + e1) * N + x;
  wa[bitrev(e0)] = inA[i0];
  wa[bitrev(e1)] = inA[i1];
  wb[bitrev(e0)] = inB[i0];

  emit(x, e0, c, wa[e0], wb[e0]);
  emit(x, e1, c, wa[e1], wb[e1]);

// Tileable foam micro-structure: R = bubble lace (multi-scale Worley edges),
// G = finer lace, B = soft fbm density, A = streak noise.
const FOAM_TEX = NOISE_WGSL + PERIODIC_WGSL + /* wgsl */ `
@group(0) @binding(0) var dst: texture_storage_2d<rgba8unorm, write>;
const SIZE: f32 = 512.0;

fn h2(i: vec2i, salt: u32) -> vec2f {
  let h = pcgHash((u32(i.x) * 73856093u) ^ pcgHash(u32(i.y) * 19349663u + salt));
  let h2v = pcgHash(h + 0x9e3779b9u);
  return vec2f(f32(h >> 8u), f32(h2v >> 8u)) / 16777216.0;
}
// "swiss cheese" foam: 1 in foam material, 0 inside bubbles; per-bubble radius
fn bubbles(uv: vec2f, period: i32, salt: u32, rmin: f32, rmax: f32) -> f32 {
  let w = vec2f(pfbm(uv * f32(period) * 0.5, period / 2, 3), pfbm(uv * f32(period) * 0.5 + 17.0, period / 2, 3));
  let p = uv * f32(period) + w * 0.9;
  let ip = vec2i(floor(p));
  let fp = p - floor(p);
  var v = 9.0;
  for (var j = -1; j <= 1; j++) {
    for (var i = -1; i <= 1; i++) {
      let o = vec2i(i, j);
      let cell = ((ip + o) % period + period) % period;
      let hh = h2(cell, salt);
      let r = vec2f(o) + hh * 0.9 + 0.05 - fp;
      let rad = mix(rmin, rmax, h2(cell, salt + 7u).x);
      v = min(v, length(r) / rad);
    }
  }
  return smoothstep(0.8, 1.25, v);
}

@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  let uv = (vec2f(id.xy) + 0.5) / SIZE;

  let w1 = vec2f(pfbm(uv * 5.0, 5, 3), pfbm(uv * 5.0 + vec2f(3.7, 9.1), 5, 3));
  let m1 = smoothstep(-0.14, 0.06, pfbm(uv * 10.0 + w1 * 1.4, 10, 5));
  let w2 = vec2f(pfbm(uv * 12.0 + 1.3, 12, 2), pfbm(uv * 12.0 + 7.9, 12, 2));
  let m2 = smoothstep(-0.16, 0.04, pfbm(uv * 27.0 + w2 * 0.9, 27, 4));
  // ... plus small round bubbles
  let b3 = bubbles(uv, 29, 37u, 0.06, 0.45);
  let b4 = bubbles(uv, 61, 53u, 0.05, 0.42);
  let dens = pfbm(uv * 4.0, 4, 5) * 0.5 + 0.5;
  let fineD = pfbm(uv * 16.0, 16, 3) * 0.5 + 0.5;
  let big = m1 * (0.55 + 0.45 * m2) * (0.75 + 0.25 * b3);
  let fine = 0.45 + 0.55 * b3 * (0.7 + 0.3 * b4);
  let streak = pfbm(uv * vec2f(4.0, 16.0), 4, 5) * 0.5 + 0.5;
  textureStore(dst, id.xy, vec4f(clamp(big * 0.6 + dens * 0.4, 0.0, 1.0), clamp(fine * 0.8 + fineD * 0.2, 0.0, 1.0), dens, streak));
}
`;

// World-space foam clipmaps (toroidally addressed, centred on the camera).
// Foam is injected where the TOTAL surface Jacobian (all cascades) folds, then decays.
const FOAM_RES = 1024;
const FOAM_UPDATE = /* wgsl */ `
const RES: i32 = ${FOAM_RES};
struct FoamU {
  snap: array<vec4i, 2>,     // per level: current camera texel (x, z), previous (x, z)
  p0: vec4f,                 // texel size level 0, level 1, dt, decay rate
  p1: vec4f,                 // J threshold, gain, growth, -
  cascL: array<vec4f, 2>,
  cascInvL: array<vec4f, 2>,
  drift: vec4f,              // foam drift velocity (m/s) xz
};
@group(0) @binding(0) var<uniform> U: FoamU;
@group(0) @binding(1) var prevTex: texture_2d_array<f32>;
@group(0) @binding(2) var dst: texture_storage_2d_array<rgba16float, write>;
@group(0) @binding(3) var dispTex: texture_2d_array<f32>;
@group(0) @binding(4) var derivTex: texture_2d_array<f32>;
@group(0) @binding(5) var samp: sampler;
@group(0) @binding(6) var sampPrev: sampler;

fn wrapIdx(i: i32, lo: i32) -> i32 { return lo + (((i - lo) % RES) + RES) % RES; }

@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  let lvl = id.z;
  let sn = U.snap[lvl];
  let ts = select(U.p0.x, U.p0.y, lvl == 1u);
  let lo = sn.xy - vec2i(RES / 2);
  let g = vec2i(wrapIdx(i32(id.x), lo.x), wrapIdx(i32(id.y), lo.y));
  let plo = sn.zw - vec2i(RES / 2);
  let inPrev = all(g >= plo) && all(g < plo + vec2i(RES));
  let p = (vec2f(g) + 0.5) * ts;
  var jxx = 0.0; var jzz = 0.0; var jxz = 0.0;
  for (var c = 0u; c < ${CASCADES}u; c++) {
    let texel = U.cascL[c >> 2u][c & 3u] / ${N}.0;
    let lod = log2(max(ts / texel, 1.0));
    if (lod < 7.5) {
      let uv = p * U.cascInvL[c >> 2u][c & 3u];
      let d = textureSampleLevel(derivTex, samp, uv, c, lod);
      let a = textureSampleLevel(dispTex, samp, uv, c, lod);
      jxx += d.z; jzz += d.w; jxz += a.w;
    }
  }
  let J = (1.0 + jxx) * (1.0 + jzz) - jxz * jxz;
  var prev = vec4f(0.0);
  if (inPrev) {
    // semi-Lagrangian advection: foam slowly drifts downwind (and spreads a little)
    let back = (vec2f(id.xy) + 0.5 - U.drift.xy * U.p0.z / ts) / f32(RES);
    prev = textureSampleLevel(prevTex, sampPrev, back, lvl, 0.0);
  }
  let dt = U.p0.z;
  let inject = clamp((U.p1.x - J) * U.p1.y, 0.0, 1.0);
  var f = prev.r * exp(-dt * U.p0.w);
  f = max(f, inject);
  f = min(f + inject * dt * U.p1.z, 1.6);
  // g: freshness (recently injected) used for brighter, denser crest foam
  let fresh = max(prev.g * exp(-dt * 1.6), inject);
  textureStore(dst, id.xy, lvl, vec4f(f, fresh, J, 1.0));
}
`;

@group(0) @binding(1) var dst: texture_storage_2d<rgba16float, write>;

  let rd = vec3f(sqrt(max(0.0, 1.0 - rm.y * rm.y)), rm.y, 0.0);

  let dt = tMax / f32(STEPS);

const MS_LUT = ATMO_CORE_WGSL + ATMO_UNIFORM + /* wgsl */ `
@group(0) @binding(1) var transLUT: texture_2d<f32>;
@group(0) @binding(2) var sampC: sampler;
@group(0) @binding(3) var dst: texture_storage_2d<rgba16float, write>;

fn sampleTrans(r: f32, mu: f32) -> vec3f {
  return textureSampleLevel(transLUT, sampC, transRMuToUV(r, mu), 0.0).rgb;
}

@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  if (f32(id.x) >= MS_SIZE || f32(id.y) >= MS_SIZE) { return; }
  var uv = (vec2f(id.xy) + 0.5) / MS_SIZE;
  uv = vec2f(fromSubUvsToUnit(uv.x, MS_SIZE), fromSubUvsToUnit(uv.y, MS_SIZE));
  let cosSun = uv.x * 2.0 - 1.0;
  let h = max(uv.y * (RT - RG), 0.01);
  let r = RG + h;
  let ro = vec3f(0.0, r, 0.0);
  let sun = vec3f(sqrt(max(0.0, 1.0 - cosSun * cosSun)), cosSun, 0.0);
  var Lsum = vec3f(0.0);
  var Fsum = vec3f(0.0);
  let SQ = 8u;
  let STEPS = 20u;
  for (var a = 0u; a < SQ; a++) {
    for (var b = 0u; b < SQ; b++) {
      let th = acos(1.0 - 2.0 * (f32(b) + 0.5) / f32(SQ));
      let ph = 2.0 * PI * (f32(a) + 0.5) / f32(SQ);
      let rd = vec3f(sin(th) * cos(ph), cos(th), sin(th) * sin(ph));
      let tTop = raySphere(ro, rd, RT);
      let tGr = raySphere(ro, rd, RG);
      var tMax = tTop.y;
      let hitG = tGr.x > 0.0;
      if (hitG) { tMax = tGr.x; }
      let dt = tMax / f32(STEPS);
      var T = vec3f(1.0);
      var L = vec3f(0.0);
      var Fms = vec3f(0.0);
      for (var s = 0u; s < STEPS; s++) {
        let p = ro + rd * ((f32(s) + 0.5) * dt);
        let pr = length(p);
        let m = medium(pr - RG, A.haze.x);
        let scat = m.rayS + vec3f(m.mieS);
        let Ts = exp(-m.ext * dt);
        let smu = dot(p, sun) / pr;
        var sunT = sampleTrans(pr, smu);
        if (sunBelowHorizon(pr, smu)) { sunT = vec3f(0.0); }
        let ext = max(m.ext, vec3f(1e-9));
        let S = scat * sunT / (4.0 * PI);
        L += T * (S - S * Ts) / ext;
        Fms += T * (scat - scat * Ts) / ext;
        T *= Ts;

        let ng = normalize(pg);
        let smu = dot(ng, sun);
        L += T * sampleTrans(RG, smu) * max(smu, 0.0) * 0.06 / PI;
      }
      Lsum += L;
      Fsum += Fms;
    }
  }
  let invN = 1.0 / f32(SQ * SQ);
  let L2 = Lsum * invN;
  let fms = Fsum * invN;
  textureStore(dst, id.xy, vec4f(L2 / (1.0 - fms), 1.0));

`;

// Sky-view LUT, recomputed every frame (sun / camera altitude may change).
const SKYVIEW_LUT = FRAME_WGSL + ATMO_CORE_WGSL + /* wgsl */ `
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var transLUT: texture_2d<f32>;
@group(0) @binding(2) var msLUT: texture_2d<f32>;
@group(0) @binding(3) var sampC: sampler;
@group(0) @binding(4) var dst: texture_storage_2d<rgba16float, write>;
const SKY_W: f32 = ${SKY_W}.0;
const SKY_H: f32 = ${SKY_H}.0;
// 1 = compute the moonlit sky (layer 1) instead of the sunlit one (layer 0)
override MOON: f32 = 0.0;

fn sampleTrans(r: f32, mu: f32) -> vec3f {
  return textureSampleLevel(transLUT, sampC, transRMuToUV(r, mu), 0.0).rgb;
}

@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  if (f32(id.x) >= SKY_W || f32(id.y) >= SKY_H) { return; }
  var uv = (vec2f(id.xy) + 0.5) / vec2f(SKY_W, SKY_H);
  uv = vec2f(fromSubUvsToUnit(uv.x, SKY_W), fromSubUvsToUnit(uv.y, SKY_H));
  let haze = F.atmo.x;
  let r = RG + F.atmo.y;
  let vHorizon = rhoOf(r);
  let cosBeta = vHorizon / r;
  let beta = acos(clamp(cosBeta, -1.0, 1.0));
  let zha = PI - beta;
  var vza: f32;
  if (uv.y < 0.5) {
    var coord = 2.0 * uv.y;
    coord = 1.0 - coord;
    coord *= coord;
    coord = 1.0 - coord;
    vza = zha * coord;
  } else {
    var coord = uv.y * 2.0 - 1.0;
    coord *= coord;
    vza = zha + beta * coord;
  }
  let vzc = cos(vza);
  let vzs = sin(vza);
  let cx = uv.x * uv.x;
  let lvc = -(cx * 2.0 - 1.0);
  let lvs = sqrt(max(0.0, 1.0 - lvc * lvc));
  let rd = vec3f(vzs * lvc, vzc, vzs * lvs);

  let sun = vec3f(sqrt(max(0.0, 1.0 - smu * smu)), smu, 0.0);

  var T = vec3f(1.0);

    let fa = (f32(i) + 1.0) / f32(STEPS);
    let tn = tMax * fa * fa;
    let dt = tn - tPrev;
    let t = tPrev + dt * 0.3;
    tPrev = tn;
    let p = ro + rd * t;
    let pr = length(p);
    let h = pr - RG;
    let m = medium(h, haze);
    let pmu = dot(p, sun) / pr;
    var sunT = sampleTrans(pr, pmu);
    if (sunBelowHorizon(pr, pmu)) { sunT = vec3f(0.0); }
    let msuv = vec2f(fromUnitToSubUvs(pmu * 0.5 + 0.5, MS_SIZE), fromUnitToSubUvs(clamp(h / (RT - RG), 0.0, 1.0), MS_SIZE));

    let S = sunT * (m.rayS * pR + vec3f(m.mieS * pM)) + ms * (m.rayS + vec3f(m.mieS));
    let Ts = exp(-m.ext * dt);
    let ext = max(m.ext, vec3f(1e-9));
    L += T * (S - S * Ts) / ext;
    T *= Ts;
  }

  // pre-exposed, so deep twilight stays well inside half-float range; the moon layer also

  textureStore(dst, id.xy, vec4f(L * select(F.astro.w, F.astro.w * F.moonDir.w, MOON > 0.5), 1.0));

// Functions for rendering the sky (background, env cube, ocean fog).
// Requires: F (Frame), transLUT, skyLUT, sampC declared by the including module.
const SKY_RENDER_FUNCS = NOISE_WGSL + /* wgsl */ `
const SKY_W: f32 = ${SKY_W}.0;
const SKY_H: f32 = ${SKY_H}.0;

fn camR() -> f32 { return RG + F.atmo.y; }

fn sampleTrans(r: f32, mu: f32) -> vec3f {
  return textureSampleLevel(transLUT, sampC, transRMuToUV(r, mu), 0.0).rgb;
}

fn sunIlluminance() -> vec3f {
  return sampleTrans(camR(), F.sunDir.y) * (F.sunDir.w * F.astro.w * earthShadow(camR(), F.sunDir.y));
}

// moonlight reaching the camera (pre-exposed), zero once the moon has set
fn moonIlluminance() -> vec3f {
  return sampleTrans(camR(), F.moonDir.y) * (F.moonDir.w * F.astro.w * earthShadow(camR(), F.moonDir.y));
}

fn skyViewUV(dir: vec3f, light: vec3f) -> vec2f {
  let r = camR();
  let vHorizon = rhoOf(r);
  let cosBeta = vHorizon / r;
  let beta = acos(clamp(cosBeta, -1.0, 1.0));
  let zha = PI - beta;
  let vzc = clamp(dir.y, -1.0, 1.0);
  var uv: vec2f;
  if (vzc >= -cosBeta) {
    var coord = acos(vzc) / zha;
    coord = 1.0 - coord;
    coord = sqrt(max(coord, 0.0));
    coord = 1.0 - coord;
    uv.y = coord * 0.5;
  } else {
    var coord = (acos(vzc) - zha) / beta;
    coord = sqrt(max(coord, 0.0));
    uv.y = coord * 0.5 + 0.5;
  }
  let dl = length(dir.xz);
  let sl = length(light.xz);
  var lvc = 1.0;
  if (dl > 1e-6 && sl > 1e-6) { lvc = clamp(dot(dir.xz, light.xz) / (dl * sl), -1.0, 1.0); }
  uv.x = sqrt(max(-lvc * 0.5 + 0.5, 0.0));
  return vec2f(fromUnitToSubUvs(uv.x, SKY_W), fromUnitToSubUvs(uv.y, SKY_H));
}

fn skyAtmo(dir: vec3f) -> vec3f {
  return textureSampleLevel(skyLUT, sampC, skyViewUV(dir, F.sunDir.xyz), 0, 0.0).rgb * F.sunDir.w
       + textureSampleLevel(skyLUT, sampC, skyViewUV(dir, F.moonDir.xyz), 1, 0.0).rgb + nightSky(dir);
}

// Moonless night sky: airglow, zodiacal light and unresolved starlight, about 21.5 mag per
// square arcsecond (2e-4 cd/m2) at the zenith and brighter towards the horizon. Far below
// anything visible by day.
const NIGHT_SKY: vec3f = vec3f(1.7e-8, 2.2e-8, 2.9e-8);
fn nightSky(dir: vec3f) -> vec3f {
  return NIGHT_SKY * (1.0 + 2.0 * (1.0 - smoothstep(0.0, 0.35, dir.y))) * F.astro.w;
}
`;

// sun-facing rims, silver linings on thin back-lit parts and warm multiple scattering.

// fbm whose octaves fade once smaller than the pixel footprint fp (noise units);
// 'billow' turns the small octaves into bulgy |noise| for cauliflower-like edges
fn cloudFbm(p: vec2f, fp: f32, oct: i32, billow: f32) -> f32 {
  var s = 0.0;
  var a = 0.5;
  var q = p;
  var f = 1.0;
  for (var i = 0; i < oct; i++) {
    // fade octaves well before they reach pixel size (half-res buffer) -> no shimmer in motion
    let w = 1.0 - smoothstep(0.08, 0.28, fp * f);
    var n = gnoise(q);
    if (i >= 2) { n = mix(n, abs(n) * 2.0 - 0.38, billow); }
    s += a * n * w;
    q = CLOUD_ROT * q * 2.03 + vec2f(13.1, 7.7);
    f *= 2.03;
    a *= 0.5;
  }
  return s;
}
// Signed "edge" functions (cloud where > 0) and their density ramps. The edge value is
// what the sky pass differentiates (fwidth) to anti-alias the cloud silhouettes analytically.
fn lowEdge(q: vec2f, fp: f32, oct: i32) -> f32 {
  let t = F.cloudP.w;
  var p = q * 0.38 + vec2f(t * 0.004, t * 0.0012);
  let w = vec2f(gnoise(p * 0.3 + vec2f(1.7, 9.2)), gnoise(p * 0.3 + vec2f(8.3, 2.8)));
  p += w * 1.4;
  // slightly elongated cells (cloud streets), mildly billowy small scales for ragged edges
  let base = cloudFbm(p * vec2f(1.0, 1.7), fp * 0.65, oct, 0.35) * 1.3 + 0.5;
  let large = gnoise(q * 0.05 + vec2f(3.1, 1.3)) * 0.7;
  return base + large - (1.0 - F.cloudP.y);
}
fn lowSoft(fp: f32) -> f32 { return 0.38 + min(fp * 0.65, 1.0) * 0.3; }
fn lowDensity(q: vec2f, fp: f32, oct: i32) -> f32 {
  return clamp(lowEdge(q, fp, oct) / lowSoft(fp), 0.0, 1.0);
}
fn highEdge(q: vec2f, fp: f32, oct: i32) -> f32 {
  let t = F.cloudP.w;
  // altostratus deck: smooth, slightly fibrous
  let p = CLOUD_ROT * (q * vec2f(0.09, 0.20)) + vec2f(t * 0.0015, 0.0);
  let n = cloudFbm(p, fp * 0.2, oct, 0.0) * 1.25 + 0.5;
  let big = gnoise(q * 0.012 + vec2f(7.0, 3.0)) * 0.6;
  return n + big - (1.0 - F.atmo.z);
}
fn highSoft(fp: f32) -> f32 { return 0.85 + min(fp * 0.2, 1.0) * 0.3; }
fn highDensity(q: vec2f, fp: f32, oct: i32) -> f32 {
  return clamp(highEdge(q, fp, oct) / highSoft(fp), 0.0, 1.0);
}

struct CloudHit { t: f32, q: vec2f, mu: f32, up: vec3f };
fn hitLayer(dir: vec3f, hc: f32) -> CloudHit {
  var h: CloudHit;
  let ro = vec3f(0.0, camR(), 0.0);
  h.t = raySphere(ro, dir, RG + hc).y;
  let p = ro + dir * h.t;
  h.up = p / length(p);
  h.q = p.xz + F.camPos.xz * 0.001;
  h.mu = max(dot(h.up, dir), 0.03);
  return h;
}

// d: density at the hit; s1..s3: densities 80 m / 250 m / 600 m towards the sun
fn shadeLayer(dir: vec3f, h: CloudHit, hc: f32, d: f32, s1: f32, s2: f32, s3: f32, sigma: f32, g: f32) -> vec4f {
  let tau = d * sigma / h.mu;
  let alpha = 1.0 - exp(-tau);
  let tauS = (d * 0.5 + s1 * 0.6 + s2 + s3 * 0.7) * sigma * 0.55;
  let Ts = exp(-tauS);
  let smu = dot(h.up, F.sunDir.xyz);
  // clouds keep the sun a little after sunset at sea level, until the Earth's shadow reaches them
  let sunC = sampleTrans(RG + hc, smu) * (F.sunDir.w * F.astro.w * earthShadow(RG + hc, smu));
  let cosT = dot(dir, F.sunDir.xyz);
  let ph = mix(phaseHG(cosT, g), phaseHG(cosT, -0.2), 0.25);
  let fwd = smoothstep(-0.2, 0.7, cosT);
  // single scattering: reflected when front-lit, transmitted through thin parts when back-lit
  let single = sunC * Ts * ph * mix(alpha * 0.55, tau * exp(-tau) * 2.2, fwd) * 3.0;
  // edges where density falls off towards the sun catch direct light
  let rim = clamp((d - s1) * 2.5, 0.0, 1.0);
  // multiple scattering: a low sun lights cloud tops and sun-facing flanks, not the bases we
  // see from below, so diffused sunlight shows mostly when looking towards the sun
  let toward = smoothstep(-0.3, 0.9, cosT);
  let ms = sunC * (0.025 + 0.22 * rim) * mix(1.0, Ts, 0.5) * alpha * (0.25 + 0.75 * toward);
  // bases are lit by the sky from the sides/below (horizon band + sea), cooler than the tops.
  // Once the cloud is in the Earth's shadow the twilight glow is concentrated towards the
  // sun, so take the horizon at right angles to it instead (the band's azimuthal average)
  let hz = mix(skyAtmo(normalize(vec3f(dir.x, 0.03, dir.z))),
               skyAtmo(normalize(vec3f(-F.sunDir.z, 0.03, F.sunDir.x))), 1.0 - earthShadow(RG + hc, smu));
  let amb = (hz * 0.26 + skyAtmo(vec3f(0.0, 1.0, 0.0)) * 0.42) * alpha * (1.0 - 0.35 * d);
  // moonlight: forward-scattered through thin parts, a dull grey glow elsewhere
  let mmu = dot(h.up, F.moonDir.xyz);
  let moonC = sampleTrans(RG + hc, mmu) * (F.moonDir.w * F.astro.w * earthShadow(RG + hc, mmu));
  let cosM = dot(dir, F.moonDir.xyz);
  let moonLit = moonC * alpha * (0.05 + 1.5 * mix(phaseHG(cosM, g), phaseHG(cosM, -0.2), 0.25)) * (1.0 - 0.4 * d);
  return vec4f(single + ms + amb + moonLit, alpha);
}

// returns (premultiplied radiance, fraction of the background sky hidden)
// aa: per-layer edge change per pixel (fwidth of the edge function); negative = estimate it
// from the pixel footprint (compute passes, which have no derivatives)
fn cloudLayers(dir: vec3f, pixAng: f32, aa: vec2f, sunT: ptr<function, f32>) -> vec4f {
  *sunT = 1.0;
  if (dir.y <= 0.0) { return vec4f(0.0); }
  let sxz = F.sunDir.xz / max(length(F.sunDir.xz), 1e-4);
  var lo = vec4f(0.0);
  var loVis = 1.0;
  if (F.cloudP.y > 0.001) {
    let hc = F.cloudP.x;
    let h = hitLayer(dir, hc);
    // clear band near the horizon, where the low sun shines under the clouds
    let far = 1.0 - smoothstep(18.0, 36.0, h.t);
    if (far > 0.0) {
      let fp = h.t * pixAng / h.mu;
      let e = lowEdge(h.q, fp, 7);
      let d = clamp(e / lowSoft(fp), 0.0, 1.0) * far;
      if (d > 0.002) {
        let s1 = lowDensity(h.q + sxz * 0.08, fp, 5) * far;
        let s2 = lowDensity(h.q + sxz * 0.25, fp, 4) * far;
        let s3 = lowDensity(h.q + sxz * 0.6, fp, 3) * far;
        lo = shadeLayer(dir, h, hc, d, s1, s2, s3, F.cloudP.z, 0.75);
        // opacity saturates within a sliver of the density ramp, making a hard silhouette:
        // spread it over ~1.5 pixels
        let aw = select(fp * 0.38 * 2.5, aa.x, aa.x >= 0.0);
        lo *= smoothstep(0.0, aw * 1.5 + 1e-6, e);
        loVis = exp(-h.t * 0.02 * (0.6 + 0.4 * F.atmo.x));
      }
    }
  }
  var hi = vec4f(0.0);
  var hiVis = 1.0;
  if (F.atmo.z > 0.001) {
    let hc = 4.5;
    let h = hitLayer(dir, hc);
    let far = 1.0 - smoothstep(30.0, 70.0, h.t);
    if (far > 0.0) {
      let fp = h.t * pixAng / h.mu;
      let e = highEdge(h.q, fp, 6);
      let d = clamp(e / highSoft(fp), 0.0, 1.0) * far;
      if (d > 0.002) {
        let s1 = highDensity(h.q + sxz * 0.15, fp, 4) * far;
        let s2 = highDensity(h.q + sxz * 0.5, fp, 3) * far;
        hi = shadeLayer(dir, h, hc, d, s1, s2, s2, F.atmo.w, 0.80);
        let aw = select(fp * 0.2 * 2.5, aa.y, aa.y >= 0.0);
        hi *= smoothstep(0.0, aw * 1.5 + 1e-6, e);
        hiVis = exp(-h.t * 0.010 * (0.6 + 0.4 * F.atmo.x));
      }
    }
  }
  *sunT = (1.0 - lo.a) * (1.0 - hi.a);
  // low layer in front; aerial perspective fades each layer into the haze without making
  // it transparent to the layer behind
  let col = lo.rgb * loVis + hi.rgb * hiVis * (1.0 - lo.a);
  let hidden = lo.a * loVis + hi.a * hiVis * (1.0 - lo.a);
  return vec4f(col, hidden);
}

fn sunDisk(dir: vec3f) -> vec3f {
  let c = dot(dir, F.sunDir.xyz);
  let ang = sqrt(max(2.0 * (1.0 - c), 0.0));
  let pix = F.screen.w * 2.0 * length(F.camUp.xyz) * 0.75;
  let edge = 1.0 - smoothstep(SUN_ANG_R - pix, SUN_ANG_R + pix, ang);
  if (edge <= 0.0) { return vec3f(0.0); }
  let x = min(ang / SUN_ANG_R, 1.0);
  let mu = sqrt(max(1.0 - x * x, 0.0));
  let limb = vec3f(1.0) - vec3f(0.397, 0.503, 0.652) * (1.0 - mu);
  let rad = F.sunDir.w * F.astro.w / (PI * SUN_ANG_R * SUN_ANG_R);
  return rad * limb * edge * sampleTrans(camR(), max(dir.y, -0.01));
}

// ---- the Moon ------------------------------------------------------------
// Albedo relative to the highlands: the maria at their selenographic positions
// (lat, lon east towards Mare Crisium, radius; degrees), with ragged edges.
var<private> MARIA: array<vec3f, 22> = array<vec3f, 22>(
  vec3f(8.0, -57.0, 18.0), vec3f(28.0, -52.0, 15.0), vec3f(-8.0, -48.0, 14.0),   // Oceanus Procellarum
  vec3f(32.8, -15.6, 19.0),   // Imbrium
  vec3f(28.0, 17.5, 11.0),    // Serenitatis
  vec3f(8.5, 31.4, 14.0),     // Tranquillitatis
  vec3f(17.0, 59.1, 9.0),     // Crisium
  vec3f(-7.8, 51.3, 12.0),    // Fecunditatis
  vec3f(-15.2, 35.5, 5.5),    // Nectaris
  vec3f(-21.3, -16.6, 11.0),  // Nubium
  vec3f(-24.4, -38.6, 6.5),   // Humorum
  vec3f(-10.0, -23.0, 6.0),   // Cognitum
  vec3f(7.5, -30.9, 8.0),     // Insularum
  vec3f(13.3, 3.6, 4.0),      // Vaporum
  vec3f(2.0, 1.0, 3.0),       // Sinus Medii
  vec3f(56.0, -38.0, 5.0), vec3f(57.0, -15.0, 6.0), vec3f(57.0, 8.0, 6.0), vec3f(56.0, 28.0, 5.0), vec3f(55.0, 45.0, 4.0),   // Frigoris
  vec3f(1.3, 87.0, 6.0),      // Smythii
  vec3f(13.0, 86.0, 5.0)      // Marginis
);
fn selVec(latDeg: f32, lonDeg: f32) -> vec3f {
  let la = radians(latDeg);
  let lo = radians(lonDeg);
  return vec3f(cos(la) * sin(lo), sin(la), cos(la) * cos(lo));
}
fn moonAlbedo(p: vec3f) -> f32 {
  var mare = 0.0;
  for (var i = 0; i < 22; i++) {
    let m = MARIA[i];
    let d = degrees(acos(clamp(dot(p, selVec(m.x, m.y)), -1.0, 1.0)));
    let wob = (gnoise(p.xy * 3.5 + vec2f(f32(i) * 3.7, 1.3)) + 0.5 * gnoise(p.yz * 8.0 + f32(i))) * 0.3 * m.z;
    // overlapping margins add up, so neighbouring maria flow into each other
    mare += smoothstep(m.z * 1.3 + wob, m.z * 0.7 + wob, d);
  }
  mare = smoothstep(0.0, 1.0, min(mare, 1.0));
  // maria vary in tone; the highlands are mottled with craters
  let tone = 0.42 + 0.08 * gnoise(p.xy * 5.0 + vec2f(7.0, 2.0));
  var a = mix(1.0, tone, mare) * (1.0 + 0.10 * gnoise(p.xy * 23.0) + 0.06 * gnoise(p.xy * 61.0 + 4.0));
  // young bright craters: Tycho with its ray system, Copernicus, Kepler, Aristarchus
  let dt = degrees(acos(clamp(dot(p, selVec(-43.3, -11.2)), -1.0, 1.0)));
  let tv = selVec(-43.3, -11.2);
  let ray = gnoise(vec2f(atan2(dot(p, cross(tv, vec3f(0.0, 1.0, 0.0))), dot(p, vec3f(0.0, 1.0, 0.0))) * 7.0, 0.5));
  a += 0.9 * exp(-dt / 1.2) + 0.35 * smoothstep(0.1, 0.6, ray) * exp(-dt / 22.0);
  a += 0.6 * exp(-degrees(acos(clamp(dot(p, selVec(9.6, -20.1)), -1.0, 1.0))) / 1.0);
  a += 0.4 * exp(-degrees(acos(clamp(dot(p, selVec(8.1, -38.0)), -1.0, 1.0))) / 0.8);
  a += 0.8 * exp(-degrees(acos(clamp(dot(p, selVec(23.7, -47.4)), -1.0, 1.0))) / 0.6);
  return a;
}
// full-moon disc radiance per unit solar illuminance (~2500 cd/m2 with the mean albedo)
const MOON_L: f32 = 0.0195;
// largest pre-exposed radiance the lit disc may reach: the night gain would burn it to a
// white blob, while the eye still sees the maria (a local adaptation)
const MOON_DISC_MAX: f32 = 1.5;
fn moonDisk(dir: vec3f) -> vec3f {
  let m = F.moonDir.xyz;
  let R = F.moonUp.w;
  let c = dot(dir, m);
  let ang = sqrt(max(2.0 * (1.0 - c), 0.0));
  let pix = F.screen.w * 2.0 * length(F.camUp.xyz) * 0.75;
  let edge = 1.0 - smoothstep(R - pix, R + pix, ang);
  if (edge <= 0.0 || F.moonDir.w <= 0.0) { return vec3f(0.0); }
  // point on the visible hemisphere and its selenographic direction
  let q = (dir - m * c) / max(R, 1e-6);
  let n = normalize(q - m * sqrt(max(1.0 - dot(q, q), 0.0)));
  let toE = -m;
  let north = normalize(F.moonUp.xyz - m * dot(F.moonUp.xyz, m));
  let east = cross(m, north);   // lunar east, towards Mare Crisium = celestial west
  let p = vec3f(dot(n, east), dot(n, north), dot(n, toE));
  let alb = moonAlbedo(p);
  // sunlight: Lommel-Seeliger (no limb darkening) with the opposition surge; the sun lights
  // it from the scene's own sun direction, so phase and terminator tilt follow geometrically
  let Ld = F.sunDir.xyz;
  let mu0 = max(dot(n, Ld), 0.0);
  let mu = max(dot(n, toE), 1e-3);
  let cosA = dot(Ld, toE);
  let surge = (1.0 + 3.5 * exp(-acos(clamp(cosA, -1.0, 1.0)) / 0.12)) / 4.5;
  var lit = F.sunDir.w * MOON_L * 2.0 / 0.8 * alb * mu0 / (mu0 + mu) * surge;
  lit *= min(1.0, MOON_DISC_MAX / (F.sunDir.w * MOON_L * F.astro.w));
  // earthshine: the sunlit Earth (full when the moon is new) lights the night side
  let es = F.sunDir.w * 2e-4 * (0.5 - 0.5 * cosA) * 0.13 / PI * alb * mu;
  let col = vec3f(1.04, 1.0, 0.93) * lit + vec3f(0.85, 0.95, 1.15) * es;
  return col * F.astro.w * edge * sampleTrans(camR(), max(dir.y, -0.01));
}

fn skyRadiance(dirIn: vec3f, withSun: bool, pixAng: f32) -> vec3f {
  var dir = dirIn;
  dir.y = max(dir.y, 0.0005);
  dir = normalize(dir);
  var L = skyAtmo(dir);
  var sunT = 1.0;
  let cl = cloudLayers(dir, pixAng, vec2f(-1.0), &sunT);
  L = L * (1.0 - cl.a) + cl.rgb;
  if (withSun) { L += sunDisk(dir) * sunT; }
  return L;
}
`;

const ENV_CUBE = FRAME_WGSL + ATMO_CORE_WGSL + /* wgsl */ `
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var transLUT: texture_2d<f32>;
@group(0) @binding(2) var skyLUT: texture_2d_array<f32>;   // layer 0: sun, 1: moon
@group(0) @binding(3) var sampC: sampler;
@group(0) @binding(4) var dst: texture_storage_2d_array<rgba16float, write>;
` + SKY_RENDER_FUNCS + SKY_CLOUD_FUNCS + /* wgsl */ `
const ENV: f32 = ${ENV_SIZE}.0;
fn faceDir(face: u32, uv: vec2f) -> vec3f {
  let u = uv.x * 2.0 - 1.0;
  let v = uv.y * 2.0 - 1.0;
  switch (face) {
    case 0u: { return vec3f(1.0, -v, -u); }
    case 1u: { return vec3f(-1.0, -v, u); }
    case 2u: { return vec3f(u, 1.0, v); }
    case 3u: { return vec3f(u, -1.0, -v); }
    case 4u: { return vec3f(u, -v, 1.0); }
    default: { return vec3f(-u, -v, -1.0); }
  }
}
@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  if (f32(id.x) >= ENV || f32(id.y) >= ENV) { return; }
  // faces are refreshed round-robin: face = (frame + z) % 6
  let face = (u32(F.post.z) + id.z) % 6u;
  let dir = normalize(faceDir(face, (vec2f(id.xy) + 0.5) / ENV));
  var L: vec3f;
  if (dir.y >= 0.0) {
    L = skyRadiance(dir, false, 1.5708 / ENV * 1.5);
  } else {
    // below the horizon: what a reflected ray would see -> far, hazy ocean
    let hz = skyRadiance(normalize(vec3f(dir.x, 0.004, dir.z)), false, 1.5708 / ENV * 1.5);
    let body = F.waterCol.rgb * (sunIlluminance() * max(F.sunDir.y, 0.0) + skyAtmo(vec3f(0.0, 1.0, 0.0)) * 2.0);
    L = mix(hz * 0.75, body, clamp(-dir.y * 6.0, 0.0, 1.0));
  }
  textureStore(dst, id.xy, face, vec4f(L, 1.0));
}
`;

const CUBE_MIPS = /* wgsl */ `
@group(0) @binding(0) var src: texture_2d_array<f32>;
@group(0) @binding(1) var dst: texture_storage_2d_array<rgba16float, write>;
@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  let size = textureDimensions(dst);
  if (id.x >= size.x || id.y >= size.y) { return; }
  let srcSize = vec2i(textureDimensions(src));
  let p = vec2i(id.xy) * 2;
  // 4x4 tent-ish filter for smoother roughness blur
  var acc = vec4f(0.0);
  var wsum = 0.0;
  for (var j = -1; j <= 2; j++) {
    for (var i = -1; i <= 2; i++) {
      let q = clamp(p + vec2i(i, j), vec2i(0), srcSize - 1);
      let w = select(1.0, 3.0, i == 0 || i == 1) * select(1.0, 3.0, j == 0 || j == 1);
      acc += textureLoad(src, q, id.z, 0) * w;
      wsum += w;
    }
  }
  textureStore(dst, id.xy, id.z, acc / wsum);
}
`;

// Cloud transmittance towards the sun (averaged over the solar disc), used to dim
// direct sunlight on the water when the sun is behind clouds.
const SUN_VIS = FRAME_WGSL + ATMO_CORE_WGSL + /* wgsl */ `
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var transLUT: texture_2d<f32>;
@group(0) @binding(2) var skyLUT: texture_2d_array<f32>;   // layer 0: sun, 1: moon
@group(0) @binding(3) var sampC: sampler;
@group(0) @binding(4) var<storage, read_write> sunVis: array<f32, 4>;
` + SKY_RENDER_FUNCS + SKY_CLOUD_FUNCS + /* wgsl */ `
var<workgroup> part: array<f32, 8>;
var<workgroup> partL: array<f32, 8>;
// Eye adaptation: the gain applied as pre-exposure when the sky gets darker than at sunset
// (partial adaptation, so night still looks like night). Exactly 1 for brighter skies.
const ADAPT_REF: f32 = ${ADAPT_REF};
const ADAPT_POW: f32 = 0.85;
// one ray per thread (7 rays across the disc), then a tiny reduction; each thread also
// measures the bare sky luminance in one direction (zenith + a ring at 24 deg elevation)
@compute @workgroup_size(8)
fn main(@builtin(local_invocation_index) k: u32) {
  let la = f32(k) * 0.8975979;
  let ld = select(normalize(vec3f(cos(la), 0.45, sin(la))), vec3f(0.0, 1.0, 0.0), k == 7u);
  partL[k] = dot(skyAtmo(ld), vec3f(0.2126, 0.7152, 0.0722)) / F.astro.w;
  let sd = F.sunDir.xyz;
  let tx = normalize(cross(sd, vec3f(0.0, 1.0, 0.0)));
  let ty = cross(tx, sd);
  var t = 1.0;
  if (k < 7u) {
    let a = f32(k) * 0.8975979;
    let o = select(vec2f(cos(a), sin(a)) * 0.65, vec2f(0.0), k == 0u);
    let dir = normalize(sd + (tx * o.x + ty * o.y) * SUN_ANG_R);
    let cl = cloudLayers(dir, 0.0, vec2f(-1.0), &t);
  }
  part[k] = t;
  workgroupBarrier();
  if (k == 0u) {
    var acc = 0.0;
    for (var i = 0u; i < 7u; i++) { acc += part[i]; }
    sunVis[0] = acc / 7.0;
    var lum = 0.0;
    for (var i = 0u; i < 8u; i++) { lum += partL[i]; }
    lum *= 0.125;
    sunVis[1] = clamp(pow(ADAPT_REF / max(lum, 1e-12), ADAPT_POW), 1.0, 1e6);
    sunVis[2] = lum;
  }
}
`;

const RENDER_BINDINGS = /* wgsl */ `
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var transLUT: texture_2d<f32>;

// Full-resolution sky + clouds. Cloud silhouettes are anti-aliased analytically: the
// screen-space derivative of each layer's edge function sets the width of its opacity edge.
const SKY_BG = FRAME_WGSL + ATMO_CORE_WGSL + RENDER_BINDINGS + SKY_RENDER_FUNCS + SKY_CLOUD_FUNCS + /* wgsl */ `
struct VO { @builtin(position) pos: vec4f, @location(0) ndc: vec2f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u)) * 2.0 - 1.0;

  let side = select(-1.0, 1.0, lp.x >= 0.0);
  let ph = i1.w;
  let amp = i2.x;
  // gliding: arms raised, hands drooped (the gull "M"); flapping: big shoulder stroke with
  // the hand lagging behind it
  let a1 = mix(0.12, 0.10 + 0.62 * sin(ph), amp) * side;
  let a2 = mix(-0.24, 0.42 * sin(ph - 0.7), amp) * side;
  var p = lp;
  var n = ln;
  if (pm.x > 1.5) {
    let q = rot(vec2f(p.x - side * WRIST, p.y), a2);
    p = vec3f(q.x + side * WRIST, q.y, p.z);
    n = vec3f(rot(n.xy, a2), n.z);
  }
  if (pm.x > 0.5) {
    let q = rot(vec2f(p.x - side * SHOULDER, p.y), a1);
    p = vec3f(q.x + side * SHOULDER, q.y, p.z);
    n = vec3f(rot(n.xy, a1), n.z);
  }
  // the body rides up on the downstroke
  p.y += 0.03 * cos(ph) * amp;
  p = vec3f(rot(p.xy, -i0.w), p.z);
  n = vec3f(rot(n.xy, -i0.w), n.z);
  let f = i1.xyz;
  let r = normalize(vec3f(-f.z, 0.0, f.x));
  let u = cross(r, f);
  // keep far birds at least a few pixels wide so they don't shimmer away
  let pixAng = 2.0 * length(F.camUp.xyz) * F.screen.w;
  let s = i2.y * clamp(5.0 * pixAng * length(i0.xyz) / SPAN, 1.0, 2.5);
  var o: VSOut;
  o.rel = i0.xyz + (r * p.x + u * p.y + f * p.z) * s;
  o.nrm = r * n.x + u * n.y + f * n.z;
  if (MIRROR > 0.5) {
    o.rel.y = -o.rel.y - 2.0 * F.camPos.y;
    o.nrm.y = -o.nrm.y;
  }
  o.pos = F.viewProj * vec4f(o.rel, 1.0);
  o.mat = pm.y;
  return o;
}

@fragment fn fs(in: VSOut) -> @location(0) vec4f {
  // the mirror image is shaded as the real bird seen from the mirrored viewpoint; dist is the
  // full camera -> water -> bird path either way
  let flip = select(vec3f(1.0), vec3f(1.0, -1.0, 1.0), MIRROR > 0.5);
  let dist = length(in.rel);
  let V = -in.rel / dist * flip;
  var n = normalize(in.nrm) * flip;
  // thin surfaces: light the side facing the viewer
  let under = dot(n, V) < 0.0;
  if (under) { n = -n; }
  let white = vec3f(0.80, 0.80, 0.78);
  var alb = white;
  var trans = 0.35;
  if (in.mat > 0.5 && in.mat < 1.5) {
    alb = select(vec3f(0.42, 0.45, 0.48), white, under);
    trans = select(0.18, 0.35, under);
  } else if (in.mat > 1.5 && in.mat < 2.5) {
    alb = vec3f(0.035, 0.035, 0.04);
    trans = 0.02;
  } else if (in.mat > 2.5) {
    alb = vec3f(0.72, 0.52, 0.10);
    trans = 0.0;
  }

  let Ld = F.sunDir.xyz;
  let sunE = sunIlluminance() * sunVis[0] * smoothstep(-0.01, 0.01, Ld.y);
  let skyUp = textureSampleLevel(envCube, sampC, vec3f(0.0, 1.0, 0.0), ENV_MAXMIP).rgb;
  let skyN = textureSampleLevel(envCube, sampC, normalize(vec3f(n.x, max(n.y, 0.05), n.z)), ENV_MAXMIP - 1.0).rgb;
  // from below: the sea is much darker than the sky it reflects
  let amb = mix(skyUp * 0.15, skyN, smoothstep(-0.5, 0.5, n.y));
  let NdL = dot(n, Ld);
  let direct = (sunE * max(NdL, 0.0) + moonIlluminance() * max(dot(n, F.moonDir.xyz), 0.0)) * 0.318;
  // sunlight diffusing through thin feathers when the bird is backlit
  let back = sunE * max(-NdL, 0.0) * 0.318 * trans;
  var col = alb * (direct + amb) + white * back;

  let T = exp(-max(F.fogExt.rgb, vec3f(F.fogExt.w)) * dist);
  let fogCol = skyAtmo(normalize(vec3f(-V.x, max(-V.y, 0.002), -V.z)));
  col = col * T + fogCol * (1.0 - T);
  return vec4f(col, 1.0);
}
`;

// ---- js/wgsl/stars.js ----
// Stars from the Yale Bright Star Catalogue: one instanced point glow per star, placed for
// the observer's sidereal time and latitude, drawn additively where only sky is behind them
// (depth still at the far plane). Physically scaled: the illuminance of each star's V
// magnitude, dimmed by atmospheric extinction and clouds, so they emerge on their own as
// twilight darkens the sky. They twinkle more through the long air path near the horizon.



const STARS = FRAME_WGSL + ATMO_CORE_WGSL + RENDER_BINDINGS + SKY_RENDER_FUNCS + SKY_CLOUD_FUNCS + /* wgsl */ `
// illuminance of a V = 0 star above the atmosphere, 10^(-0.4 * 14.18) lux, in renderer
// units (solar illuminance 1.28e5 lux = 14)
const STAR_E0: f32 = 2.34e-10;
const PSF: f32 = 0.8;   // point spread, gaussian sigma in pixels

struct VSOut {
  @builtin(position) pos: vec4f,
  @location(0) off: vec2f,
  @location(1) col: vec3f,
};

// s0 = RA, Dec (rad), relative illuminance 10^(-0.4 V), twinkle seed; s1 = linear rgb
@vertex fn vs(@builtin(vertex_index) vi: u32, @location(0) s0: vec4f, @location(1) s1: vec4f) -> VSOut {
  var o: VSOut;
  o.pos = vec4f(2.0, 2.0, 0.0, 1.0);   // off screen unless the star is up
  o.off = vec2f(0.0);
  o.col = vec3f(0.0);
  // equatorial -> local east / north / up
  let H = F.astro.x - s0.x;
  let cd = cos(s0.y);
  let sd = sin(s0.y);
  let cl = cos(F.astro.y);
  let sl = sin(F.astro.y);
  let e = -cd * sin(H);
  let n = sd * cl - cd * sl * cos(H);
  let u = sd * sl + cd * cl * cos(H);
  if (u < -0.01) { return o; }
  // true north lies at scene azimuth F.astro.z (scene azimuth a: direction (sin a, 0, -cos a))
  let co = cos(F.astro.z);
  let so = sin(F.astro.z);
  let dir = vec3f(e * co + n * so, u, e * so - n * co);
  if (dot(dir, F.moonDir.xyz) > cos(F.moonUp.w)) { return o; }   // behind the moon
  var clip = F.viewProj * vec4f(dir, 0.0);   // at infinity: depth 0 (reverse-Z far plane)
  if (clip.w <= 0.0) { return o; }

  var d2 = dir;
  d2.y = max(d2.y, 0.0005);
  d2 = normalize(d2);
  var sunT = 1.0;
  let cloud = cloudLayers(d2, 0.0, vec2f(-1.0), &sunT);
  let t = F.camPos.w;
  let amp = 0.06 + 0.45 * (1.0 - smoothstep(0.03, 0.5, u));
  let tw = max(0.15, 1.0 + amp * (0.6 * sin(t * 13.7 + s0.w * 61.0) + 0.4 * sin(t * 29.3 + s0.w * 17.0)));
  let E = STAR_E0 * s0.z * tw * F.astro.w * (1.0 - cloud.a);
  let pixAng = 2.0 * length(F.camUp.xyz) * F.screen.w;
  // peak radiance of the gaussian spot carrying the star's illuminance
  o.col = s1.rgb * sampleTrans(camR(), max(u, 0.0)) * (E / (2.0 * PI * PSF * PSF * pixAng * pixAng));

  var corners = array<vec2f, 6>(vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0),
                                vec2f(-1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, 1.0));
  let c = corners[vi] * (3.0 * PSF);
  clip = vec4f(clip.xy + c * 2.0 * F.screen.zw * clip.w, 0.0, clip.w);
  o.pos = clip;
  o.off = c;
  return o;
}

@fragment fn fs(in: VSOut) -> @location(0) vec4f {
  return vec4f(in.col * exp(-0.5 * dot(in.off, in.off) / (PSF * PSF)), 0.0);
}
`;

// Bloom (dual-filter chain) and final composite with AgX tonemapping.
const FS_TRI = /* wgsl */ `
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  var o: VO;
  o.pos = vec4f(p * 2.0 - 1.0, 0.0, 1.0);
  o.uv = vec2f(p.x, 1.0 - p.y);
  return o;
}
`;

const BLOOM_DOWN = FS_TRI + /* wgsl */ `
struct P { texel: vec4f };   // xy = 1/src size, z = first pass (karis + threshold)
@group(0) @binding(0) var src: texture_2d<f32>;
@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var<uniform> U: P;
fn luma(c: vec3f) -> f32 { return dot(c, vec3f(0.2126, 0.7152, 0.0722)); }
fn tap(uv: vec2f) -> vec3f { return textureSampleLevel(src, samp, uv, 0.0).rgb; }
fn karis(c: vec3f) -> f32 { return 1.0 / (1.0 + luma(c) * 0.25); }
@fragment fn fs(in: VO) -> @location(0) vec4f {
  let t = U.texel.xy;
  let uv = in.uv;
  let a = tap(uv + t * vec2f(-2.0, -2.0));
  let b = tap(uv + t * vec2f(0.0, -2.0));
  let c = tap(uv + t * vec2f(2.0, -2.0));
  let d = tap(uv + t * vec2f(-2.0, 0.0));
  let e = tap(uv);
  let f = tap(uv + t * vec2f(2.0, 0.0));
  let g = tap(uv + t * vec2f(-2.0, 2.0));
  let h = tap(uv + t * vec2f(0.0, 2.0));
  let i = tap(uv + t * vec2f(2.0, 2.0));
  let j = tap(uv + t * vec2f(-1.0, -1.0));
  let k = tap(uv + t * vec2f(1.0, -1.0));
  let l = tap(uv + t * vec2f(-1.0, 1.0));
  let m = tap(uv + t * vec2f(1.0, 1.0));
  var o: vec3f;
  if (U.texel.z > 0.5) {
    // Karis average on the first downsample to tame fireflies from sun glints
    let g0 = (a + b + d + e) * 0.25;
    let g1 = (b + c + e + f) * 0.25;
    let g2 = (d + e + g + h) * 0.25;
    let g3 = (e + f + h + i) * 0.25;
    let g4 = (j + k + l + m) * 0.25;
    let w0 = karis(g0) * 0.125; let w1 = karis(g1) * 0.125; let w2 = karis(g2) * 0.125;
    let w3 = karis(g3) * 0.125; let w4 = karis(g4) * 0.5;
    o = (g0 * w0 + g1 * w1 + g2 * w2 + g3 * w3 + g4 * w4) / (w0 + w1 + w2 + w3 + w4);
  } else {
    o = e * 0.125 + (a + c + g + i) * 0.03125 + (b + d + f + h) * 0.0625 + (j + k + l + m) * 0.125;
  }
  return vec4f(min(o, vec3f(6.0e4)), 1.0);
}
`;

const BLOOM_UP = FS_TRI + /* wgsl */ `
struct P { texel: vec4f };   // xy = 1/src size, z = radius, w = weight
@group(0) @binding(0) var src: texture_2d<f32>;
@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var<uniform> U: P;
fn tap(uv: vec2f) -> vec3f { return textureSampleLevel(src, samp, uv, 0.0).rgb; }
@fragment fn fs(in: VO) -> @location(0) vec4f {
  let t = U.texel.xy * U.texel.z;
  let uv = in.uv;
  var o = tap(uv) * 4.0;
  o += (tap(uv + vec2f(-t.x, 0.0)) + tap(uv + vec2f(t.x, 0.0)) + tap(uv + vec2f(0.0, -t.y)) + tap(uv + vec2f(0.0, t.y))) * 2.0;
  o += tap(uv + vec2f(-t.x, -t.y)) + tap(uv + vec2f(t.x, -t.y)) + tap(uv + vec2f(-t.x, t.y)) + tap(uv + vec2f(t.x, t.y));
  return vec4f(o * (U.texel.w / 16.0), 1.0);
}

const COMPOSITE = FS_TRI + /* wgsl */ `
struct P { p: vec4f, q: vec4f };  // p: exposure, bloom, frame, vignette; q: saturation, contrast, warmth, grain
@group(0) @binding(0) var hdr: texture_2d<f32>;
@group(0) @binding(1) var bloom: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;
@group(0) @binding(3) var<uniform> U: P;

fn agxContrast(x: vec3f) -> vec3f {
  let x2 = x * x;
  let x4 = x2 * x2;
  return 15.5 * x4 * x2 - 40.14 * x4 * x + 31.96 * x4 - 6.868 * x2 * x + 0.4298 * x2 + 0.1191 * x - 0.00232;
}
fn agx(v: vec3f) -> vec3f {
  let m = mat3x3f(0.842479062253094, 0.0423282422610123, 0.0423756549057051,
                  0.0784335999999992, 0.878468636469772, 0.0784336,
                  0.0792237451477643, 0.0791661274605434, 0.879142973793104);
  let minEv = -12.47393;
  let maxEv = 4.026069;
  var x = m * max(v, vec3f(1e-10));
  x = clamp(log2(x), vec3f(minEv), vec3f(maxEv));
  x = (x - minEv) / (maxEv - minEv);
  return agxContrast(x);
}
fn agxEotf(v: vec3f) -> vec3f {
  let mi = mat3x3f(1.19687900512017, -0.0528968517574562, -0.0529716355144438,
                   -0.0980208811401368, 1.15190312990417, -0.0980434501171241,
                   -0.0990297440797205, -0.0989611768448433, 1.15107367264116);

fn agxLook(v: vec3f, sat: f32, power: f32) -> vec3f {
  let l = dot(v, vec3f(0.2126, 0.7152, 0.0722));
  let p = pow(max(v, vec3f(0.0)), vec3f(power));
  return l + sat * (p - l);
}

@fragment fn fs(in: VO) -> @location(0) vec4f {
  let dims = vec2f(textureDimensions(hdr));

  var c = textureLoad(hdr, pc, 0).rgb;

  let b = textureSampleLevel(bloom, samp, in.uv, 0.0).rgb * (1.0 / 8.0);
  c = mix(c, b, U.p.y);
  c *= U.p.x;

  let d = (in.uv - 0.5) * vec2f(dims.x / dims.y, 1.0);
  c *= 1.0 - U.p.w * dot(d, d);
  c *= vec3f(1.0 + U.q.z, 1.0, 1.0 - U.q.z);
  // film/sensor-like highlight desaturation: very bright glints and the sun go towards white
  let lum = dot(c, vec3f(0.2126, 0.7152, 0.0722));

  var o = agx(c);
  o = agxLook(o, U.q.x, U.q.y);
  o = agxEotf(o);

  let n = ign(in.pos.xy + U.p.z * 5.588238) + ign(in.pos.xy * 1.37 + 17.0 + U.p.z * 3.1) - 1.0;

}
`;

// The scene's sun elevation slider picks the time: the evening moment on the chosen date
// when the sun reaches that elevation.
const DEG = Math.PI / 180;

const LOCATIONS = {
  lajolla: { name: 'La Jolla', lat: 32.8328, lon: -117.2713, tz: 'America/Los_Angeles' },
  santorini: { name: 'Santorini', lat: 36.4167, lon: 25.4318, tz: 'Europe/Athens' },
  split: { name: 'Split', lat: 43.5081, lon: 16.4402, tz: 'Europe/Zagreb' },
  keywest: { name: 'Key West', lat: 24.5551, lon: -81.7800, tz: 'America/New_York' },
};

// today's calendar date (YYYY-MM-DD) in a time zone
function todayIn(tz) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(new Date());
}

const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));
// d: days since J2000.0 (2000-01-01 12:00 UT)
function sunRaDec(d) {
  const g = (357.529 + 0.98560028 * d) * DEG;
  const L = (280.459 + 0.98564736 * d + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * DEG;
  const e = (23.439 - 0.00000036 * d) * DEG;
  return [Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)), Math.asin(Math.sin(e) * Math.sin(L)), L];
}
const gmst = (d) => ((280.46061837 + 360.98564736629 * d) % 360) * DEG;
const J2000_MS = Date.UTC(2000, 0, 1, 12);

// The evening moment on the local calendar date dateStr when the sun stands at elevDeg.
// Returns local sidereal time and latitude (rad), the sun's true azimuth (rad from north
// through east) and the UTC time in ms. Elevations above the day's maximum give local noon.
function solveSky(loc, dateStr, elevDeg) {
  const [y, m, day] = dateStr.split('-').map(Number);
  const lat = loc.lat * DEG, lon = loc.lon * DEG;
  // start at local mean noon and step along the hour angle
  let d = (Date.UTC(y, m - 1, day, 12) - J2000_MS) / 864e5 - loc.lon / 360;
  const sinE = Math.sin(elevDeg * DEG);
  for (let i = 0; i < 5; i++) {
    const [ra, dec] = sunRaDec(d);
    const c = (sinE - Math.sin(lat) * Math.sin(dec)) / (Math.cos(lat) * Math.cos(dec));
    const H = Math.acos(Math.max(-1, Math.min(1, c)));
    d += wrapAngle(H - (gmst(d) + lon - ra)) / (2 * Math.PI * 1.00273790935);
  }
  const [ra, dec] = sunRaDec(d);
  const lst = gmst(d) + lon;
  const [sunAz] = altAz(ra, dec, lst, lat);
  return { d, lst: wrapAngle(lst), lat, sunAz, utcMs: J2000_MS + d * 864e5 };
}

// equatorial (rad) -> [azimuth from north through east, altitude] for sidereal time lst
function altAz(ra, dec, lst, lat) {
  const ha = lst - ra;
  const east = -Math.cos(dec) * Math.sin(ha);
  const north = Math.sin(dec) * Math.cos(lat) - Math.cos(dec) * Math.sin(lat) * Math.cos(ha);
  const up = Math.sin(dec) * Math.sin(lat) + Math.cos(dec) * Math.cos(lat) * Math.cos(ha);
  return [Math.atan2(east, north), Math.asin(Math.max(-1, Math.min(1, up)))];
}

// The Moon: main periodic terms of Meeus' lunar theory (Astronomical Algorithms ch. 47),
// good to ~0.2 deg. Returns geocentric RA, Dec (rad), distance (km) and ecliptic longitude.
function moonRaDec(d) {
  const T = d / 36525;
  const r = (x) => (x % 360) * DEG;
  const Lp = r(218.3164477 + 481267.88123421 * T);
  const D = r(297.8501921 + 445267.1114034 * T);
  const M = r(357.5291092 + 35999.0502909 * T);
  const Mp = r(134.9633964 + 477198.8675055 * T);
  const F = r(93.2720950 + 483202.0175233 * T);
  const s = Math.sin, c = Math.cos;
  const lon = Lp + DEG * (6.289 * s(Mp) + 1.274 * s(2 * D - Mp) + 0.658 * s(2 * D) + 0.214 * s(2 * Mp)
    - 0.186 * s(M) - 0.114 * s(2 * F) + 0.059 * s(2 * D - 2 * Mp) + 0.057 * s(2 * D - M - Mp)
    + 0.053 * s(2 * D + Mp) + 0.046 * s(2 * D - M) - 0.041 * s(M - Mp) - 0.035 * s(D) - 0.030 * s(M + Mp));
  const lat = DEG * (5.128 * s(F) + 0.281 * s(Mp + F) + 0.278 * s(Mp - F) + 0.173 * s(2 * D - F)
    + 0.055 * s(2 * D - Mp + F) - 0.046 * s(2 * D - Mp - F) + 0.033 * s(2 * D + F) + 0.017 * s(2 * Mp + F));
  const dist = 385000.56 - 20905.355 * c(Mp) - 3699.111 * c(2 * D - Mp) - 2955.968 * c(2 * D)
    - 569.925 * c(2 * Mp) + 48.888 * c(M) + 246.158 * c(2 * D - 2 * Mp) - 152.138 * c(2 * D - M - Mp)
    - 170.733 * c(2 * D + Mp) - 204.586 * c(2 * D - M) - 129.620 * c(M - Mp) + 108.743 * c(D) + 104.755 * c(M + Mp);
  const e = (23.439 - 0.00000036 * d) * DEG;
  const ra = Math.atan2(s(lon) * c(e) - Math.tan(lat) * s(e), c(lon));
  const dec = Math.asin(s(lat) * c(e) + c(lat) * s(e) * s(lon));
  return { ra, dec, dist, lon };
}

// The Moon seen from the observer at day d: true azimuth and topocentric altitude (rad),
// angular radius, illuminated fraction, waxing flag, and the moonlight illuminance above
// the atmosphere (lux) from its phase (Allen's magnitude law) and distance.
function moonFor(d, lst, lat) {
  const m = moonRaDec(d);
  const [az, altGeo] = altAz(m.ra, m.dec, lst, lat);
  const alt = altGeo - Math.asin(6378.14 / m.dist) * Math.cos(altGeo);   // parallax, up to ~1 deg
  const [sra, sdec, sunLon] = sunRaDec(d);
  const cosElong = Math.sin(sdec) * Math.sin(m.dec) + Math.cos(sdec) * Math.cos(m.dec) * Math.cos(m.ra - sra);
  const phase = Math.PI - Math.acos(Math.max(-1, Math.min(1, cosElong)));   // sun-moon-earth angle
  const pDeg = phase / DEG;
  const mag = -12.73 + 0.026 * pDeg + 4e-9 * pDeg ** 4 + 5 * Math.log10(m.dist / 384400);
  return {
    az, alt, dist: m.dist, radius: Math.asin(1737.4 / m.dist),
    illum: (1 + Math.cos(phase)) / 2, waxing: Math.sin(m.lon - sunLon) > 0,
    lux: Math.pow(10, -0.4 * (mag + 14.18)),
  };
}

// The north ecliptic pole (~ the Moon's north, within 1.5 deg) for orienting the lunar face
const ECLIPTIC_POLE = [18 * 15 * DEG, (90 - 23.439) * DEG];

// Linear sRGB (luminance 1) of a blackbody star with colour index B-V: Ballesteros (2012)
// temperature, Kim et al. (2002) Planckian locus chromaticity.
function starColor(bv, out, o) {
  const T = Math.max(1667, Math.min(25000, 4600 * (1 / (0.92 * bv + 1.7) + 1 / (0.92 * bv + 0.62))));
  const t = 1e3 / T, t2 = t * t, t3 = t2 * t;
  const x = T <= 4000 ? -0.2661239 * t3 - 0.2343589 * t2 + 0.8776956 * t + 0.179910
    : -3.0258469 * t3 + 2.1070379 * t2 + 0.2226347 * t + 0.240390;
  const y = T <= 2222 ? -1.1063814 * x ** 3 - 1.34811020 * x * x + 2.18555832 * x - 0.20219683
    : T <= 4000 ? -0.9549476 * x ** 3 - 1.37418593 * x * x + 2.09137015 * x - 0.16748867
      : 3.0817580 * x ** 3 - 5.87338670 * x * x + 3.75112997 * x - 0.37001483;
  const X = x / y, Z = (1 - x - y) / y;
  const r = Math.max(0, 3.2406 * X - 1.5372 - 0.4986 * Z);
  const g = Math.max(0, -0.9689 * X + 1.8758 + 0.0415 * Z);
  const b = Math.max(0, 0.0557 * X - 0.2040 + 1.0570 * Z);
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  out[o] = r / lum; out[o + 1] = g / lum; out[o + 2] = b / lum;
}

// Packed catalogue (see stars.js) -> 8 floats per star:
// RA, Dec (rad), relative illuminance 10^(-0.4 V), twinkle seed, linear rgb, 0
function decodeStars(b64, count) {
  const bin = atob(b64);
  const dv = new DataView(new Uint8Array(Array.from(bin, (ch) => ch.charCodeAt(0))).buffer);
  const out = new Float32Array(count * 8);
  for (let i = 0; i < count; i++) {
    const p = i * 6, o = i * 8;
    out[o] = (dv.getUint16(p, true) / 65536) * 2 * Math.PI;
    out[o + 1] = (dv.getInt16(p + 2, true) / 32767) * (Math.PI / 2);
    out[o + 2] = Math.pow(10, -0.4 * (dv.getUint8(p + 4) / 20 - 2));
    out[o + 3] = ((i * 0.618034) % 1) * 10;
    starColor(dv.getInt8(p + 5) / 50, out, o + 4);
  }
  return out;
}

// ---- js/birds.js ----
// Seagulls. A few small flocks simulated on the CPU: boids steering towards waypoints that
// circle an anchor lazily following the camera, so the birds stay around wherever you fly.
// Drawn as instanced low-poly gulls with articulated wings by wgsl/birds.js.
// All state lives in preallocated typed arrays (no per-frame garbage).
const MAX_BIRDS = 64;
const BIRD_FLOATS = 12;   // per instance: rel pos + roll, forward + flap phase, flap amount + size
// per bird for the ocean's shadow test: rel pos + projected half-span, right axis + size, forward
const SHADOW_FLOATS = 12;
const FLOCKS = 4;
const TAU = Math.PI * 2;

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Gull mesh in bird space (x right, y up, z forward; 1.36 m wingspan). 8 floats per vertex:
// position, normal, part (0 body, 1 inner wing, 2 hand), material (0 white, 1 wing: grey above
// and white below, 2 black wingtip, 3 beak). Non-indexed triangle list.
function buildBirdMesh() {
  const out = [];
  const vtx = (x, y, z, nx, ny, nz, part, mat) => [x, y, z, nx, ny, nz, part, mat];
  const tri = (a, b, c) => out.push(...a, ...b, ...c);
  const quad = (a, b, c, d) => { tri(a, b, c); tri(a, c, d); };

  // body: elliptical rings lofted along z, wings attach at y = 0 (upper body)
  const RINGS = [
    // z, half width, half height, centre y
    [-0.30, 0.010, 0.008, -0.010],
    [-0.20, 0.045, 0.040, -0.018],
    [-0.04, 0.068, 0.066, -0.022],
    [0.10, 0.058, 0.058, -0.012],
    [0.18, 0.034, 0.038, 0.012],
    [0.235, 0.042, 0.042, 0.028],
    [0.285, 0.016, 0.018, 0.028],
  ];
  const SEG = 8;
  const ringV = (r, k, mat) => {
    const a = (k / SEG) * TAU, c = Math.cos(a), s = Math.sin(a);
    const nl = Math.hypot(c * r[2], s * r[1]);
    return vtx(c * r[1], r[3] + s * r[2], r[0], (c * r[2]) / nl, (s * r[1]) / nl, 0, 0, mat);
  };
  for (let i = 0; i + 1 < RINGS.length; i++) {
    for (let k = 0; k < SEG; k++) {
      quad(ringV(RINGS[i], k, 0), ringV(RINGS[i], k + 1, 0), ringV(RINGS[i + 1], k + 1, 0), ringV(RINGS[i + 1], k, 0));
    }
  }
  const head = RINGS[RINGS.length - 1];
  const tip = vtx(0, 0.022, 0.36, 0, 0, 1, 0, 3);
  for (let k = 0; k < SEG; k++) tri(ringV(head, k, 3), ringV(head, k + 1, 3), tip);

  const flat = (x, y, z, part, mat) => vtx(x, y, z, 0, 1, 0, part, mat);
  // tail
  quad(flat(-0.035, -0.012, -0.20, 0, 0), flat(0.035, -0.012, -0.20, 0, 0),
    flat(0.075, -0.016, -0.38, 0, 0), flat(-0.075, -0.016, -0.38, 0, 0));
  // wings: inner arm, grey hand, black tip (swept back)
  const WING = [
    // part, material, inner x, leading z, trailing z, outer x, leading z, trailing z
    [1, 1, 0.05, 0.07, -0.13, 0.32, 0.06, -0.12],
    [2, 1, 0.32, 0.06, -0.12, 0.54, -0.01, -0.13],
    [2, 2, 0.54, -0.01, -0.13, 0.68, -0.13, -0.16],
  ];
  for (const s of [1, -1]) {
    for (const [part, mat, x0, l0, t0, x1, l1, t1] of WING) {
      quad(flat(s * x0, 0, l0, part, mat), flat(s * x1, 0, l1, part, mat),
        flat(s * x1, 0, t1, part, mat), flat(s * x0, 0, t0, part, mat));
    }
  }
  return new Float32Array(out);
}

function createBirds(seed = 1) {
  const rnd = mulberry32(seed);
  const range = (a, b) => a + (b - a) * rnd();
  const n = MAX_BIRDS;
  const pos = new Float64Array(n * 3), vel = new Float32Array(n * 3);
  const form = new Float32Array(n * 3);   // slot offset from the flock waypoint
  const cruise = new Float32Array(n), freq = new Float32Array(n), size = new Float32Array(n);
  const phase = new Float32Array(n), amp = new Float32Array(n), bank = new Float32Array(n);
  const burst = new Uint8Array(n), burstT = new Float32Array(n);
  const inst = new Float32Array(n * BIRD_FLOATS);
  const shadow = new Float32Array(n * SHADOW_FLOATS);

  // Flocks start at fixed bearings around the camera (angle 0 = +x, -pi/2 = straight ahead
  // of the start view) and slowly drift around it.
  const FLOCK_INIT = [
    // bearing, distance (m), altitude (m), orbit radius (m)
    [-1.75, 70, 12, 30],
    [-1.20, 220, 28, 60],
    [0.90, 120, 18, 45],
    [2.60, 65, 9, 28],
  ];
  const fAng = new Float64Array(FLOCKS), fRad = new Float32Array(FLOCKS), fDrift = new Float32Array(FLOCKS);
  const fAx = new Float64Array(FLOCKS), fAz = new Float64Array(FLOCKS);
  const fAlt = new Float32Array(FLOCKS), fOrbR = new Float32Array(FLOCKS);
  const fTh = new Float64Array(FLOCKS), fDir = new Float32Array(FLOCKS);
  const wx = new Float64Array(FLOCKS), wy = new Float64Array(FLOCKS), wz = new Float64Array(FLOCKS);
  for (let f = 0; f < FLOCKS; f++) {
    const [a, d, h, r] = FLOCK_INIT[f];
    fAng[f] = a; fRad[f] = d; fAlt[f] = h; fOrbR[f] = r;
    fDrift[f] = range(-0.006, 0.006);
    fTh[f] = range(0, TAU);
    fDir[f] = rnd() < 0.5 ? -1 : 1;
  }
  for (let i = 0; i < n; i++) {
    const a = range(0, TAU), r = 12 * Math.sqrt(rnd());
    form[i * 3] = Math.cos(a) * r; form[i * 3 + 1] = range(-3, 3); form[i * 3 + 2] = Math.sin(a) * r;
    cruise[i] = range(8.5, 11.5);
    freq[i] = range(2.6, 3.4);
    size[i] = range(0.88, 1.1);
    phase[i] = range(0, TAU);
    burstT[i] = range(0, 6);
  }

  function spawn(i, f) {
    const o = i * 3;
    pos[o] = wx[f] + form[o] + range(-4, 4);
    pos[o + 1] = Math.max(wy[f] + form[o + 1], 6);
    pos[o + 2] = wz[f] + form[o + 2] + range(-4, 4);
    // fly along the orbit
    const s = fDir[f] * cruise[i];
    vel[o] = -Math.sin(fTh[f]) * s; vel[o + 1] = 0; vel[o + 2] = Math.cos(fTh[f]) * s;
    amp[i] = 0; bank[i] = 0;
  }

  let time = 0, first = true;

  function update(dt, cx, cy, cz) {
    time += dt;
    for (let f = 0; f < FLOCKS; f++) {
      fAng[f] += fDrift[f] * dt;
      const tx = cx + Math.cos(fAng[f]) * fRad[f], tz = cz + Math.sin(fAng[f]) * fRad[f];
      let respawn = first;
      const ox = cx - fAx[f], oz = cz - fAz[f], od = Math.hypot(ox, oz);
      if (first) {
        fAx[f] = tx; fAz[f] = tz;
      } else if (od > 900) {
        // left far behind (fast flight): reappear far ahead, then drift back into place
        fAx[f] = cx + (ox / od) * 600; fAz[f] = cz + (oz / od) * 600;
        respawn = true;
      } else {
        const k = Math.min(1, dt * 0.08);
        fAx[f] += (tx - fAx[f]) * k; fAz[f] += (tz - fAz[f]) * k;
      }
      const R = fOrbR[f] * (1 + 0.3 * Math.sin(time * 0.05 + f * 1.7));
      fTh[f] += dt * fDir[f] * 7.5 / R;
      wx[f] = fAx[f] + Math.cos(fTh[f]) * R;
      wy[f] = fAlt[f] + 5 * Math.sin(fTh[f] * 0.37 + f);
      wz[f] = fAz[f] + Math.sin(fTh[f]) * R;
      if (respawn) for (let i = f; i < n; i += FLOCKS) spawn(i, f);
    }
    first = false;

    for (let i = 0; i < n; i++) {
      const f = i % FLOCKS, o = i * 3;
      const px = pos[o], py = pos[o + 1], pz = pos[o + 2];
      const vx = vel[o], vy = vel[o + 1], vz = vel[o + 2];
      // seek this bird's slot around the waypoint
      const gx = wx[f] + form[o] - px, gy = Math.max(wy[f] + form[o + 1], 6) - py, gz = wz[f] + form[o + 2] - pz;
      const gk = cruise[i] / (Math.hypot(gx, gy, gz) + 1e-6);
      let dx = gx * gk, dy = gy * gk, dz = gz * gk;
      // flockmates: separation, alignment, cohesion
      let cnt = 0, ax = 0, ay = 0, az = 0, mx = 0, my = 0, mz = 0;
      for (let j = f; j < n; j += FLOCKS) {
        if (j === i) continue;
        const q = j * 3;
        const rx = pos[q] - px, ry = pos[q + 1] - py, rz = pos[q + 2] - pz;
        const d2 = rx * rx + ry * ry + rz * rz;
        if (d2 > 1600) continue;
        cnt++;
        ax += vel[q]; ay += vel[q + 1]; az += vel[q + 2];
        mx += rx; my += ry; mz += rz;
        if (d2 < 16) {
          const k = 6 / Math.max(d2, 0.25);
          dx -= rx * k; dy -= ry * k; dz -= rz * k;
        }
      }
      if (cnt) {
        const ic = 1 / cnt;
        dx += (ax * ic - vx) * 0.3 + mx * ic * 0.04;
        dy += (ay * ic - vy) * 0.3 + my * ic * 0.04;
        dz += (az * ic - vz) * 0.3 + mz * ic * 0.04;
      }
      // stay clear of the waves and out of the camera's face
      if (py < 5) dy += (5 - py) * 2;
      const ex = px - cx, ey = py - cy, ez = pz - cz, e2 = ex * ex + ey * ey + ez * ez;
      if (e2 < 100) {
        const k = 40 / Math.max(e2, 1);
        dx += ex * k; dy += ey * k; dz += ez * k;
      }
      dy = Math.max(-3.5, Math.min(3.5, dy));
      let accx = (dx - vx) * 1.2, accy = (dy - vy) * 1.2, accz = (dz - vz) * 1.2;
      const al = Math.hypot(accx, accy, accz);
      if (al > 6) { const k = 6 / al; accx *= k; accy *= k; accz *= k; }
      let nvx = vx + accx * dt, nvy = vy + accy * dt, nvz = vz + accz * dt;
      let sp = Math.hypot(nvx, nvy, nvz);
      const cs = Math.max(6, Math.min(15, sp));
      nvx *= cs / sp; nvy *= cs / sp; nvz *= cs / sp; sp = cs;
      vel[o] = nvx; vel[o + 1] = nvy; vel[o + 2] = nvz;
      pos[o] = px + nvx * dt; pos[o + 1] = py + nvy * dt; pos[o + 2] = pz + nvz * dt;

      // bank into turns (right vector of the flight direction is (-fz, 0, fx))
      const hs = Math.hypot(nvx, nvz) + 1e-6;
      const lat = (-accx * nvz + accz * nvx) / hs;
      const tb = Math.max(-0.9, Math.min(0.9, Math.atan2(lat, 9.81) * 1.4));
      bank[i] += (tb - bank[i]) * Math.min(1, dt * 3);

      // wing beat: flap when climbing or slow and in occasional bursts, glide otherwise
      burstT[i] -= dt;
      if (burstT[i] <= 0) {
        burst[i] ^= 1;
        burstT[i] = burst[i] ? range(0.8, 2.2) : range(3, 10);
      }
      const tgt = Math.max(0, Math.min(1, nvy * 0.45 + (cruise[i] - sp) * 0.35 + burst[i]));
      amp[i] += (tgt - amp[i]) * Math.min(1, dt * 2.5);
      phase[i] = (phase[i] + dt * TAU * freq[i]) % TAU;

      const b = i * BIRD_FLOATS, is = 1 / sp;
      inst[b] = pos[o] - cx; inst[b + 1] = pos[o + 1] - cy; inst[b + 2] = pos[o + 2] - cz; inst[b + 3] = bank[i];
      inst[b + 4] = nvx * is; inst[b + 5] = nvy * is; inst[b + 6] = nvz * is; inst[b + 7] = phase[i];
      inst[b + 8] = amp[i]; inst[b + 9] = size[i]; inst[b + 10] = 0; inst[b + 11] = 0;

      // shadow caster: wing plane axes with the roll applied (matches the vertex shader) and
      // the half-span shortened by the current wing angles
      const fx = inst[b + 4], fy = inst[b + 5], fz = inst[b + 6];
      const rx0 = -fz / hs * sp, rz0 = fx / hs * sp;
      const ux = -rz0 * fy, uy = rz0 * fx - rx0 * fz, uz = rx0 * fy;
      const cr = Math.cos(bank[i]), sr = Math.sin(bank[i]);
      const a1 = 0.12 + (0.10 + 0.62 * Math.sin(phase[i]) - 0.12) * amp[i];
      const a2 = -0.24 + (0.42 * Math.sin(phase[i] - 0.7) + 0.24) * amp[i];
      const s = i * SHADOW_FLOATS;

      shadow[s + 8] = fx; shadow[s + 9] = fy; shadow[s + 10] = fz; shadow[s + 11] = 0;

  }

function mat4Mul(out, a, b) {

    const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
    out[c * 4] = a[0] * b0 + a[4] * b1 + a[8] * b2 + a[12] * b3;
    out[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9] * b2 + a[13] * b3;
    out[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
    out[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
